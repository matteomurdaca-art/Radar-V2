<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR — Dashboard comunale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B10;
  --surface:#0E1620;
  --surface-2:#131E2A;
  --line:#1C2A38;
  --text:#E6F1F7;
  --muted:#7E93A3;
  --cyan:#00E5FF;
  --cyan-dim:rgba(0,229,255,.12);
  --nuova:#00E5FF;
  --carico:#FFB020;
  --risolta:#34D399;
  --respinta:#64748B;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}

/* ---------- Header ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0B131C,#070B10);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{
  font-family:var(--display);font-weight:700;font-size:19px;
  letter-spacing:.22em;margin:0;
}
.brand .sub{
  font-family:var(--mono);font-size:10px;color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;margin-top:-2px;
}
.comune{
  margin-left:auto;text-align:right;
}
.comune .nome{font-family:var(--display);font-weight:500;font-size:14px}
.comune .ruolo{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.live{
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--cyan);text-transform:uppercase;
  padding:5px 10px;border:1px solid rgba(0,229,255,.25);border-radius:99px;
  background:var(--cyan-dim);
}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- Layout ---------- */
.shell{
  display:grid;
  grid-template-columns:300px minmax(0,1fr) 380px;
  gap:1px;background:var(--line);
  min-height:calc(100vh - 61px);
}
.col{background:var(--bg);min-width:0}
.scroll{overflow-y:auto;max-height:calc(100vh - 61px)}

/* ---------- Scope (elemento firma) ---------- */
.scope-wrap{padding:20px 18px 14px}
.scope{position:relative;width:100%;aspect-ratio:1;max-width:264px;margin:0 auto}
.scope svg{width:100%;height:100%;display:block}
.sweep{transform-origin:150px 150px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{cursor:pointer;transition:r .15s ease}
.blip:hover circle,.blip.on circle{r:7}
.scope-legend{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9.5px;color:var(--muted);
  letter-spacing:.08em;margin-top:10px;padding:0 4px;
}

/* ---------- Filtri ---------- */
.side-sec{padding:16px 18px;border-top:1px solid var(--line)}
.side-sec h2{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:500;
}
.stat{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;border-radius:var(--r);
  border:1px solid transparent;text-align:left;margin-bottom:5px;
  transition:background .12s,border-color .12s;
}
.stat:hover{background:var(--surface)}
.stat[aria-pressed="true"]{background:var(--surface-2);border-color:var(--line)}
.stat .sq{width:8px;height:8px;border-radius:2px;flex:none}
.stat .lb{flex:1;font-size:13px}
.stat .n{font-family:var(--mono);font-size:14px;color:var(--muted)}
.stat[aria-pressed="true"] .n{color:var(--text)}

.ghost{
  width:100%;padding:9px;border:1px solid var(--line);border-radius:var(--r);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);transition:border-color .12s,color .12s;
}
.ghost:hover{border-color:var(--cyan);color:var(--cyan)}

/* ---------- Lista ---------- */
.list-head{
  display:flex;gap:10px;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.search{
  flex:1;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;color:var(--text);
  font-family:var(--body);font-size:13px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--cyan)}
select.search{cursor:pointer;flex:none;width:150px}

.cards{padding:12px}
.card{
  display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--line);
  border-radius:var(--r);padding:13px 15px;margin-bottom:9px;
  transition:border-color .12s,transform .12s;
}
.card:hover{transform:translateX(2px)}
.card.on{background:var(--surface-2);border-color:rgba(0,229,255,.35)}
.card-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.code{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.badge{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid currentColor;
}
.when{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.card h3{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 3px}
.addr{font-size:12.5px;color:var(--muted);margin:0}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px;
}
.tag.anon{color:var(--carico);border-color:rgba(255,176,32,.3)}

.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);color:var(--text);font-size:16px;margin-bottom:6px;font-weight:500}

/* ---------- Dettaglio ---------- */
.detail{padding:20px}
.detail-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.detail-head .code{display:block;margin-bottom:7px}
.detail-head h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 8px;line-height:1.25}
.media{
  aspect-ratio:4/3;border-radius:var(--r);border:1px solid var(--line);
  background:
    repeating-linear-gradient(45deg,#101A24 0 12px,#0D151E 12px 24px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);margin-bottom:14px;
}
.media .mono{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.audio{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:14px;
}
.play{
  width:32px;height:32px;border-radius:50%;flex:none;
  border:1px solid rgba(0,229,255,.35);color:var(--cyan);
  display:flex;align-items:center;justify-content:center;background:var(--cyan-dim);
}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:24px}
.wave span{flex:1;background:rgba(0,229,255,.35);border-radius:1px}

.field{margin-bottom:15px}
.field .k{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px;
}
.field .v{font-size:13.5px}
.field .v.mono{font-family:var(--mono);font-size:12px}
.quote{
  background:var(--surface);border-left:2px solid var(--cyan);
  border-radius:0 var(--r) var(--r) 0;padding:11px 13px;font-size:13.5px;
}

.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 14px}
.timeline li::before{
  content:"";position:absolute;left:-21px;top:5px;
  width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--bg);
}
.timeline li:first-child::before{background:var(--cyan)}
.timeline .t{font-size:13px}
.timeline .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  border-top:1px solid var(--line);padding-top:16px;margin-top:4px;
}
.act{
  padding:11px;border-radius:var(--r);border:1px solid var(--line);
  font-size:12.5px;font-weight:500;transition:border-color .12s,background .12s,color .12s;
}
.act:hover:not(:disabled){background:var(--surface-2)}
.act:disabled{opacity:.35;cursor:not-allowed}
.act.primary{border-color:rgba(0,229,255,.4);color:var(--cyan);background:var(--cyan-dim)}
.act.ok{border-color:rgba(52,211,153,.4);color:var(--risolta)}
.act.no{color:var(--respinta)}
.act.wide{grid-column:1/-1}

textarea.note{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);color:var(--text);font-family:var(--body);font-size:13px;
  padding:10px 12px;resize:vertical;min-height:70px;margin-top:4px;
}
textarea.note:focus{outline:none;border-color:var(--cyan)}

.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:400px;padding:40px;text-align:center;color:var(--muted);gap:14px;
}
.placeholder p{max-width:230px;margin:0;font-size:13px}

.close-detail{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .shell{grid-template-columns:260px minmax(0,1fr) 340px}
}
@media (max-width:980px){
  .shell{display:block;background:var(--bg)}
  .scroll{max-height:none;overflow:visible}
  .col-side{border-bottom:1px solid var(--line)}
  .scope-wrap{display:none}
  .col-detail{
    display:none;position:fixed;inset:0;z-index:50;
    background:var(--bg);overflow-y:auto;
  }
  .col-detail.open{display:block}
  .close-detail{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:14px 20px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .comune{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* --- Accesso operatori --- */
.login{position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:24px}
.login[hidden]{display:none}
.login-box{width:100%;max-width:360px;background:var(--panel);
  border:1px solid var(--linea);border-radius:14px;padding:26px 24px}
.login-box h2{font-family:var(--display);font-size:19px;margin:14px 0 4px;font-weight:500}
.login-box p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}
.login-box label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.login-box input{width:100%;box-sizing:border-box;background:#0B131C;color:var(--testo);
  border:1px solid var(--linea);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px}
.login-box input:focus{outline:none;border-color:var(--ciano)}
.login-box button{width:100%;margin-top:20px;background:var(--ciano);color:#06131A;
  border:0;border-radius:9px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.login-box button:disabled{opacity:.6;cursor:default}
.login-err{margin-top:14px;background:rgba(255,90,90,.09);border:1px solid rgba(255,90,90,.32);
  color:#FF9B9B;border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.45}
.login-err[hidden]{display:none}

/* --- Elementi aggiunti al dettaglio --- */
.esci{background:none;border:0;color:var(--ciano);font:inherit;font-size:12px;
  cursor:pointer;padding:0;text-decoration:underline}
.media-box img{width:100%;border-radius:10px;border:1px solid var(--linea);display:block}
.maplink{display:inline-block;margin-top:6px;color:var(--ciano);font-size:12.5px;text-decoration:none}
.maplink:hover{text-decoration:underline}
.err-azione{margin-top:12px;background:rgba(255,90,90,.09);border:1px solid rgba(255,90,90,.32);
  color:#FF9B9B;border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.45}
.err-azione[hidden]{display:none}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login-box" id="loginForm">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#00E5FF" stroke-opacity=".22" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#00E5FF" stroke-opacity=".38" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#00E5FF" stroke-opacity=".6" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="2.4" fill="#00E5FF"/>
    </svg>
    <h2>Accesso operatori</h2>
    <p>Le segnalazioni dei cittadini sono riservate al personale del Comune.</p>
    <label for="lgEmail">Email</label>
    <input id="lgEmail" type="email" autocomplete="username" required>
    <label for="lgPw">Password</label>
    <input id="lgPw" type="password" autocomplete="current-password" required>
    <button type="submit" id="lgBtn">Entra</button>
    <div class="login-err" id="lgErr" hidden></div>
  </form>
</div>


<header class="topbar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#00E5FF" stroke-opacity=".22" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#00E5FF" stroke-opacity=".38" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#00E5FF" stroke-opacity=".6" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="2.4" fill="#00E5FF"/>
    </svg>
    <div>
      <h1>RADAR</h1>
      <div class="sub">Dashboard comunale</div>
    </div>
  </div>
  <div class="live"><span class="dot"></span> In ascolto</div>
  <div class="comune">
    <div class="nome" id="nomeComune">Comune di Verrone</div>
    <div class="ruolo" id="ruoloOperatore">non connesso</div>
  </div>
</header>

<div class="shell">

  <!-- Colonna sinistra: scope + filtri -->
  <aside class="col col-side scroll">
    <div class="scope-wrap">
      <div class="scope">
        <svg viewBox="0 0 300 300" role="img" aria-label="Mappa radar delle segnalazioni attorno al municipio">
          <defs>
            <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#00E5FF" stop-opacity=".28"/>
              <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <circle cx="150" cy="150" r="140" fill="#0B131C" stroke="#1C2A38"/>
          <circle cx="150" cy="150" r="105" fill="none" stroke="#1C2A38"/>
          <circle cx="150" cy="150" r="70" fill="none" stroke="#1C2A38"/>
          <circle cx="150" cy="150" r="35" fill="none" stroke="#1C2A38"/>
          <line x1="10" y1="150" x2="290" y2="150" stroke="#1C2A38"/>
          <line x1="150" y1="10" x2="150" y2="290" stroke="#1C2A38"/>
          <g class="sweep"><path d="M150 150 L290 150 A140 140 0 0 0 251 51 Z" fill="url(#sw)"/></g>
          <circle cx="150" cy="150" r="3.5" fill="#00E5FF"/>
          <g id="blips"></g>
        </svg>
      </div>
      <div class="scope-legend"><span>Municipio</span><span>Raggio 3 km</span></div>
    </div>

    <div class="side-sec">
      <h2>Stato</h2>
      <div id="filtri"></div>
    </div>

    <div class="side-sec">
      <h2>Report</h2>
      <button class="ghost" id="btnCsv">Esporta elenco in CSV</button>
    </div>
  </aside>

  <!-- Colonna centrale: lista -->
  <main class="col scroll">
    <div class="list-head">
      <input class="search" id="q" type="search" placeholder="Cerca per via, codice o parola…" aria-label="Cerca segnalazioni">
      <select class="search" id="cat" aria-label="Filtra per categoria">
        <option value="">Tutte le categorie</option>
      </select>
    </div>
    <div class="cards" id="lista"></div>
  </main>

  <!-- Colonna destra: dettaglio -->
  <section class="col col-detail scroll" id="pannello">
    <button class="close-detail" id="btnChiudi">← Torna all'elenco</button>
    <div id="dettaglio"></div>
  </section>

</div>

<script>
/* =========================================================
   RADAR — Dashboard comunale
   Collegata a Supabase. Accesso riservato agli operatori.

   >>> COMPILARE LE DUE RIGHE QUI SOTTO <<<
   Sono gli stessi due valori usati nell'app del cittadino:
   SUPABASE_URL = Project URL   (es. https://abcdefgh.supabase.co)
   SUPABASE_KEY = chiave pubblica (anon public / publishable)
   ========================================================= */

var SUPABASE_URL = 'https://niyotnrttnklpqyylfmq.supabase.co';
var SUPABASE_KEY = 'sb_publishable_xnZuoub2QFpYMtEMgdOmHg_I7_j4nHH';

const MUNICIPIO = { lat: 45.5628, lng: 8.0583 }; // centro dello scope
const RAGGIO_KM = 3;
const RICARICA_MS = 60000;                       // aggiornamento automatico

const STATI = {
  nuova:    { label: "Nuova",       colore: "var(--nuova)"   },
  carico:   { label: "In carico",   colore: "var(--carico)"  },
  risolta:  { label: "Risolta",     colore: "var(--risolta)" },
  respinta: { label: "Respinta",    colore: "var(--respinta)"}
};

let SEGNALAZIONI = [];
let selezionata = null;
let filtroStato = null;
let sess = null;          // { access_token, refresh_token, email }
let timerRicarica = null;

/* ---------- Utility ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function quando(iso){
  const d = new Date(iso), diff = (Date.now() - d) / 60000;
  if (diff < 60) return Math.max(1, Math.round(diff)) + " min fa";
  if (diff < 1440) return Math.round(diff/60) + " h fa";
  if (diff < 2880) return "ieri";
  return Math.round(diff/1440) + " giorni fa";
}
function dataEstesa(iso){
  return new Date(iso).toLocaleString("it-IT",
    { day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

/* ---------- Sessione (in memoria, con appoggio al browser se disponibile) ---------- */
function salvaSessione(s){
  sess = s;
  try { sessionStorage.setItem("radar_sess", JSON.stringify(s)); } catch(e){}
}
function leggiSessione(){
  try {
    const v = sessionStorage.getItem("radar_sess");
    if (v) sess = JSON.parse(v);
  } catch(e){}
  return sess;
}
function scartaSessione(){
  sess = null;
  try { sessionStorage.removeItem("radar_sess"); } catch(e){}
}

/* ---------- Chiamate a Supabase ---------- */
function headers(extra){
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (sess ? sess.access_token : SUPABASE_KEY),
    "Content-Type": "application/json"
  }, extra || {});
}

function login(email, password){
  return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(r => r.json().then(d => ({ ok: r.ok, d: d })))
  .then(res => {
    if (!res.ok || !res.d.access_token){
      throw new Error(res.d.error_description || res.d.msg || res.d.message || "Credenziali non valide");
    }
    salvaSessione({
      access_token: res.d.access_token,
      refresh_token: res.d.refresh_token,
      email: (res.d.user && res.d.user.email) || email
    });
  });
}

function rinnova(){
  if (!sess || !sess.refresh_token) return Promise.reject(new Error("nessuna sessione"));
  return fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: sess.refresh_token })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.access_token) throw new Error("sessione scaduta");
    salvaSessione({ access_token: d.access_token, refresh_token: d.refresh_token, email: sess.email });
  });
}

// Esegue una chiamata autenticata; se il token è scaduto lo rinnova una volta sola.
function api(path, opts, giaRiprovato){
  opts = opts || {};
  return fetch(SUPABASE_URL + path, {
    method: opts.method || "GET",
    headers: headers(opts.headers),
    body: opts.body
  }).then(r => {
    if ((r.status === 401 || r.status === 403) && !giaRiprovato){
      return rinnova().then(() => api(path, opts, true))
        .catch(() => { const e = new Error("SESSIONE_SCADUTA"); throw e; });
    }
    if (!r.ok) return r.text().then(t => { throw new Error(t || ("Errore " + r.status)); });
    if (r.status === 204) return null;
    return r.json();
  });
}

/* ---------- Caricamento dati ---------- */
function sintesi(testo){
  const t = String(testo || "").trim().replace(/\s+/g, " ");
  if (!t) return "Segnalazione senza descrizione";
  const punto = t.indexOf(". ");
  if (punto > 12 && punto < 80) return t.slice(0, punto);
  return t.length > 78 ? t.slice(0, 75) + "…" : t;
}

function mappa(r, logs){
  return {
    uid: r.id,
    id: r.codice,
    cat: r.categoria || "Altro",
    titolo: r.titolo || sintesi(r.descrizione),
    indirizzo: r.indirizzo ||
      (r.lat != null ? "Posizione rilevata dal telefono" : "Posizione non disponibile"),
    lat: r.lat, lng: r.lng,
    stato: r.stato,
    ts: r.creata_il,
    urgenza: r.urgenza,
    anonima: !!r.anonima,
    cittadino: r.nome,
    contatto: r.contatto,
    foto: !!r.ha_foto,
    vocale: !!r.ha_vocale,
    fotoPath: r.foto_path,
    vocalePath: r.vocale_path,
    nota: r.nota_interna || "",
    testo: r.descrizione,
    storico: (logs[r.id] || []).map(l => ({ s: l.stato, t: l.quando, chi: l.chi || "Operatore" }))
  };
}

function caricaDati(){
  return Promise.all([
    api("/rest/v1/segnalazioni_dashboard?select=*&order=creata_il.desc"),
    api("/rest/v1/stati_log?select=segnalazione_id,stato,chi,quando&order=quando.desc")
  ]).then(([righe, logs]) => {
    const perId = {};
    (logs || []).forEach(l => {
      (perId[l.segnalazione_id] = perId[l.segnalazione_id] || []).push(l);
    });
    SEGNALAZIONI = (righe || []).map(r => mappa(r, perId));
    aggiornaCategorie();
    if (selezionata && !SEGNALAZIONI.some(s => s.id === selezionata)) selezionata = null;
    render();
    segnaAggiornamento();
  });
}

function erroreDati(msg){
  $("#lista").innerHTML = `<div class="empty">
    <strong>Dati non leggibili</strong>
    ${esc(msg)}
  </div>`;
}

function segnaAggiornamento(){
  const el = $("#ultimoAgg");
  if (el) el.textContent = "aggiornato " + new Date().toLocaleTimeString("it-IT",
    { hour:"2-digit", minute:"2-digit" });
}

function aggiornaCategorie(){
  const sel = $("#cat"), scelta = sel.value;
  sel.innerHTML = '<option value="">Tutte le categorie</option>';
  [...new Set(SEGNALAZIONI.map(s => s.cat))].sort().forEach(c => {
    const o = document.createElement("option");
    o.value = o.textContent = c;
    sel.appendChild(o);
  });
  sel.value = scelta;
}

/* ---------- Allegati: link firmati temporanei ---------- */
function firma(path){
  return api("/storage/v1/object/sign/allegati/" + path, {
    method: "POST",
    body: JSON.stringify({ expiresIn: 3600 })
  }).then(d => SUPABASE_URL + "/storage/v1" + d.signedURL);
}

function caricaAllegati(s){
  if (s.fotoPath){
    firma(s.fotoPath)
      .then(u => { const i = $("#fotoReale"); if (i){ i.src = u; i.hidden = false; $("#fotoAttesa").hidden = true; } })
      .catch(() => { const a = $("#fotoAttesa"); if (a) a.textContent = "Foto non caricabile"; });
  }
  if (s.vocalePath){
    firma(s.vocalePath)
      .then(u => { const a = $("#audioReale"); if (a){ a.src = u; a.hidden = false; $("#audioAttesa").hidden = true; } })
      .catch(() => { const a = $("#audioAttesa"); if (a) a.textContent = "Vocale non caricabile"; });
  }
}

/* ---------- Scope radar ---------- */
function disegnaBlips(){
  const g = $("#blips");
  const kmPerLat = 111, kmPerLng = 111 * Math.cos(MUNICIPIO.lat * Math.PI/180);
  g.innerHTML = visibili().filter(s => s.lat != null && s.lng != null).map(s => {
    const dx = (s.lng - MUNICIPIO.lng) * kmPerLng;
    const dy = (s.lat - MUNICIPIO.lat) * kmPerLat;
    const x = 150 + Math.max(-1, Math.min(1, dx / RAGGIO_KM)) * 132;
    const y = 150 - Math.max(-1, Math.min(1, dy / RAGGIO_KM)) * 132;
    const on = selezionata === s.id ? " on" : "";
    return `<g class="blip${on}" data-id="${s.id}" role="button" tabindex="0"
              aria-label="${esc(s.id)} — ${esc(s.titolo)}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${STATI[s.stato].colore}" opacity=".12"/>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${STATI[s.stato].colore}"/>
    </g>`;
  }).join("");
}

/* ---------- Filtri e ricerca ---------- */
function visibili(){
  const q = ($("#q").value || "").trim().toLowerCase();
  const c = $("#cat").value;
  return SEGNALAZIONI.filter(s => {
    if (filtroStato && s.stato !== filtroStato) return false;
    if (c && s.cat !== c) return false;
    if (q){
      const testo = [s.id, s.titolo, s.indirizzo, s.testo, s.cat, s.cittadino].join(" ").toLowerCase();
      if (!testo.includes(q)) return false;
    }
    return true;
  });
}

function disegnaFiltri(){
  const conta = st => SEGNALAZIONI.filter(s => s.stato === st).length;
  const voci = [["", "Tutte", SEGNALAZIONI.length]]
    .concat(Object.keys(STATI).map(k => [k, STATI[k].label, conta(k)]));
  $("#filtri").innerHTML = voci.map(([k, label, n]) => `
    <button class="stat ${filtroStato === (k || null) ? "on" : ""}" data-stato="${k}">
      <span>${label}</span><span class="n">${n}</span>
    </button>`).join("");
}

/* ---------- Lista ---------- */
function disegnaLista(){
  const el = $("#lista"), dati = visibili();
  if (!dati.length){
    el.innerHTML = `<div class="empty">
      <strong>Nessuna segnalazione</strong>
      ${SEGNALAZIONI.length
        ? 'Nessun risultato con questi filtri. Prova a togliere la ricerca o a scegliere "Tutte".'
        : 'Non è ancora arrivata nessuna segnalazione.'}
    </div>`;
    return;
  }
  el.innerHTML = dati.map(s => {
    const st = STATI[s.stato];
    return `<button class="card ${selezionata===s.id?"on":""}" data-id="${s.id}"
              style="border-left-color:${st.colore}">
      <div class="card-top">
        <span class="code">${s.id}</span>
        <span class="badge" style="color:${st.colore}">${st.label}</span>
        <span class="when">${quando(s.ts)}</span>
      </div>
      <h3>${esc(s.titolo)}</h3>
      <p class="addr">${esc(s.indirizzo)}</p>
      <div class="tags">
        <span class="tag">${esc(s.cat)}</span>
        ${s.urgenza ? `<span class="tag">Urgenza ${esc(s.urgenza)}</span>` : ""}
        ${s.foto ? '<span class="tag">Foto</span>' : ""}
        ${s.vocale ? '<span class="tag">Vocale</span>' : ""}
      </div>
    </button>`;
  }).join("");
}

/* ---------- Dettaglio ---------- */
function disegnaDettaglio(){
  const box = $("#dettaglio");
  const s = SEGNALAZIONI.find(x => x.id === selezionata);
  if (!s){
    box.innerHTML = `<div class="placeholder">
      <svg width="46" height="46" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#1C2A38" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="11" fill="none" stroke="#1C2A38" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="2.4" fill="#1C2A38"/>
      </svg>
      <p>Scegli una segnalazione dall'elenco o un punto sul radar per vederne il dettaglio.</p>
    </div>`;
    return;
  }
  const st = STATI[s.stato];
  const coord = (s.lat != null && s.lng != null)
    ? `<div class="v mono" style="color:var(--muted);margin-top:3px">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>
       <a class="maplink" href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">Apri in mappa ↗</a>`
    : `<div class="v mono" style="color:var(--muted);margin-top:3px">coordinate non trasmesse</div>`;

  box.innerHTML = `<div class="detail">
    <div class="detail-head">
      <span class="code">${s.id} · ${esc(s.cat)}${s.urgenza ? " · urgenza " + esc(s.urgenza) : ""}</span>
      <h2>${esc(s.titolo)}</h2>
      <span class="badge" style="color:${st.colore}">${st.label}</span>
      <span class="when" style="margin-left:8px">${dataEstesa(s.ts)}</span>
    </div>

    ${s.foto ? `<div class="field">
        <div class="k">Foto allegata</div>
        <div class="media-box">
          <span class="mono" id="fotoAttesa">Caricamento foto…</span>
          <img id="fotoReale" alt="Foto allegata dal cittadino" hidden>
        </div>
      </div>` : ""}

    ${s.vocale ? `<div class="field">
        <div class="k">Messaggio vocale</div>
        <span class="mono" id="audioAttesa">Caricamento audio…</span>
        <audio id="audioReale" controls hidden style="width:100%"></audio>
      </div>` : ""}

    <div class="field">
      <div class="k">Descrizione</div>
      <div class="quote">${esc(s.testo)}</div>
    </div>

    <div class="field">
      <div class="k">Posizione</div>
      <div class="v">${esc(s.indirizzo)}</div>
      ${coord}
    </div>

    <div class="field">
      <div class="k">Chi ha segnalato</div>
      <div class="v">${esc(s.cittadino) || "—"}<br>
        <span class="mono" style="color:var(--muted)">${esc(s.contatto) || "nessun recapito"}</span></div>
    </div>

    <div class="field">
      <div class="k">Storico</div>
      <ul class="timeline">
        ${s.storico.length ? s.storico.map(h => `<li>
          <div class="t">${(STATI[h.s] || {label:h.s}).label}</div>
          <div class="m">${dataEstesa(h.t)} · ${esc(h.chi)}</div>
        </li>`).join("") : '<li><div class="m">Nessun passaggio registrato</div></li>'}
      </ul>
    </div>

    <div class="field">
      <div class="k">Nota interna</div>
      <textarea class="note" id="notaBox" placeholder="Visibile solo agli operatori del comune">${esc(s.nota)}</textarea>
      <button class="ghost" id="btnNota" style="margin-top:8px">Salva nota</button>
    </div>

    <div class="actions">
      <button class="act primary" data-azione="carico" ${s.stato!=="nuova"?"disabled":""}>Prendi in carico</button>
      <button class="act ok" data-azione="risolta" ${s.stato==="risolta"||s.stato==="respinta"?"disabled":""}>Segna risolta</button>
      <button class="act no wide" data-azione="respinta" ${s.stato==="respinta"?"disabled":""}>Respingi — non di competenza</button>
    </div>

    <div class="err-azione" id="errAzione" hidden></div>
  </div>`;

  caricaAllegati(s);
}

/* ---------- Azioni sul database ---------- */
function mostraErrore(msg){
  const e = $("#errAzione");
  if (e){ e.textContent = msg; e.hidden = false; }
}

function cambiaStato(nuovo){
  const s = SEGNALAZIONI.find(x => x.id === selezionata);
  if (!s) return;
  api("/rest/v1/segnalazioni?id=eq." + s.uid, {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({ stato: nuovo })
  })
  .then(() => caricaDati())
  .catch(err => mostraErrore("Non è stato possibile aggiornare lo stato: " + err.message));
}

function salvaNota(){
  const s = SEGNALAZIONI.find(x => x.id === selezionata);
  const box = $("#notaBox");
  if (!s || !box) return;
  const btn = $("#btnNota");
  btn.disabled = true; btn.textContent = "Salvataggio…";
  api("/rest/v1/segnalazioni?id=eq." + s.uid, {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({ nota_interna: box.value })
  })
  .then(() => { s.nota = box.value; btn.textContent = "Nota salvata"; setTimeout(() => {
      if ($("#btnNota")){ $("#btnNota").textContent = "Salva nota"; $("#btnNota").disabled = false; }
    }, 1800); })
  .catch(err => { btn.disabled = false; btn.textContent = "Salva nota";
                  mostraErrore("Nota non salvata: " + err.message); });
}

/* ---------- CSV ---------- */
function esportaCsv(){
  const righe = [["Codice","Data","Categoria","Urgenza","Stato","Titolo","Posizione","Lat","Lng","Segnalato da","Recapito","Descrizione","Nota interna"]]
    .concat(visibili().map(s => [
      s.id, dataEstesa(s.ts), s.cat, s.urgenza || "", STATI[s.stato].label, s.titolo,
      s.indirizzo, s.lat ?? "", s.lng ?? "", s.cittadino || "", s.contatto || "", s.testo, s.nota
    ]));
  const csv = "\uFEFF" + righe.map(r =>
    r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `radar-segnalazioni-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Render + eventi ---------- */
function render(){
  disegnaFiltri();
  disegnaLista();
  disegnaBlips();
  disegnaDettaglio();
}

function apri(id){
  selezionata = id;
  render();
  if (window.innerWidth <= 980) $("#pannello").classList.add("open");
}

document.addEventListener("click", e => {
  const stat = e.target.closest(".stat");
  if (stat){ filtroStato = stat.dataset.stato || null; render(); return; }

  const card = e.target.closest(".card");
  if (card){ apri(card.dataset.id); return; }

  const blip = e.target.closest(".blip");
  if (blip){ apri(blip.dataset.id); return; }

  const act = e.target.closest(".act");
  if (act && !act.disabled){ cambiaStato(act.dataset.azione); return; }

  if (e.target.closest("#btnNota")){ salvaNota(); return; }
  if (e.target.closest("#btnCsv")) esportaCsv();
  if (e.target.closest("#btnChiudi")) $("#pannello").classList.remove("open");
  if (e.target.closest("#btnEsci")) esci();
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){
    const blip = e.target.closest?.(".blip");
    if (blip){ e.preventDefault(); apri(blip.dataset.id); }
  }
  if (e.key === "Escape") $("#pannello").classList.remove("open");
});

$("#q").addEventListener("input", () => { disegnaLista(); disegnaBlips(); });
$("#cat").addEventListener("change", () => { disegnaLista(); disegnaBlips(); });

/* ---------- Avvio, login e uscita ---------- */
function entra(){
  $("#login").hidden = true;
  $("#ruoloOperatore").innerHTML =
    esc(sess.email) + ' · <button class="esci" id="btnEsci">esci</button>' +
    ' <span class="mono" id="ultimoAgg" style="color:var(--muted)"></span>';
  caricaDati().catch(err => {
    const m = String(err && err.message || err);
    if (m.indexOf("SESSIONE_SCADUTA") !== -1){
      scartaSessione();
      mostraLogin("Sessione scaduta, rifai l'accesso.");
    } else {
      erroreDati("L'accesso e' riuscito ma la lettura delle segnalazioni ha risposto: " + m);
    }
  });
  clearInterval(timerRicarica);
  timerRicarica = setInterval(() => {
    caricaDati().catch(err => {
      if (String(err && err.message).indexOf("SESSIONE_SCADUTA") !== -1){
        scartaSessione(); mostraLogin("Sessione scaduta, rifai l'accesso.");
      }
    });
  }, RICARICA_MS);
}

function mostraLogin(msg){
  clearInterval(timerRicarica);
  $("#login").hidden = false;
  const e = $("#lgErr");
  if (msg){ e.textContent = msg; e.hidden = false; } else { e.hidden = true; }
}

function esci(){
  scartaSessione();
  SEGNALAZIONI = []; selezionata = null;
  render();
  mostraLogin(null);
}

$("#loginForm").addEventListener("submit", ev => {
  ev.preventDefault();
  const btn = $("#lgBtn");
  btn.disabled = true; btn.textContent = "Accesso in corso…";
  $("#lgErr").hidden = true;
  login($("#lgEmail").value.trim(), $("#lgPw").value)
    .then(() => { $("#lgPw").value = ""; entra(); })
    .catch(err => mostraLogin(err.message))
    .finally(() => { btn.disabled = false; btn.textContent = "Entra"; });
});

if (SUPABASE_URL.indexOf("TUO-PROGETTO") !== -1){
  mostraLogin("Configurazione mancante: compila SUPABASE_URL e SUPABASE_KEY nel file.");
} else if (leggiSessione()){
  entra();
} else {
  mostraLogin(null);
}

render();

</script>
</body>
</html>
